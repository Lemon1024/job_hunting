name: Supabase keepalive

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Query Supabase with an anonymous client key
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          set +x

          fail() {
            printf '::error::%s\n' "$1"
            exit 1
          }

          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]]; then
            fail 'Configure SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY in Actions secrets.'
          fi
          if [[ ! "$SUPABASE_URL" =~ ^https://[a-z0-9-]+\.supabase\.co/?$ ]]; then
            fail 'SUPABASE_URL must be the HTTPS project URL from the Supabase dashboard.'
          fi
          if [[ "$SUPABASE_PUBLISHABLE_KEY" == *$'\r'* || "$SUPABASE_PUBLISHABLE_KEY" == *$'\n'* ]]; then
            fail 'The client key must not contain line breaks.'
          fi

          # Validate the key type without printing the key or decoded JWT.
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *.*.*)
              payload="${SUPABASE_PUBLISHABLE_KEY#*.}"
              payload="${payload%%.*}"
              payload="${payload//-/+}"
              payload="${payload//_/\/}"
              case $((${#payload} % 4)) in
                2) payload+='==' ;;
                3) payload+='=' ;;
                1) fail 'Use a publishable key or legacy anon key, never a service_role key.' ;;
              esac
              if ! { printf '%s' "$payload" | base64 --decode | jq -e '.role == "anon"' >/dev/null; } 2>/dev/null; then
                fail 'Use a publishable key or legacy anon key, never a service_role key.'
              fi
              unset payload
              ;;
            *) fail 'Use a publishable key or legacy anon key, never a secret key.' ;;
          esac

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          endpoint="${SUPABASE_URL%/}/rest/v1/applications?select=id&limit=1"

          for attempt in 1 2 3; do
            curl_exit=0
            status=$(curl --silent --request GET --proto '=https' \
              --connect-timeout 5 --max-time 15 \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              --header 'Accept: application/json' \
              --output "$response_file" --write-out '%{http_code}' \
              "$endpoint" 2>/dev/null) || curl_exit=$?

            if [[ "$curl_exit" -eq 0 && "$status" == '200' ]]; then
              if ! jq -e -s 'length == 1 and (.[0] | type == "array" and length == 0)' "$response_file" >/dev/null 2>&1; then
                fail 'Expected an empty JSON array; check anonymous access and RLS. Response omitted.'
              fi
              printf '%s Supabase database query succeeded (HTTP 200).\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              exit 0
            fi

            if [[ "$curl_exit" -ne 0 ]]; then
              reason="Request failed (curl exit $curl_exit)."
            elif [[ "$status" == '429' || "$status" =~ ^5[0-9][0-9]$ ]]; then
              reason="Temporary HTTP $status."
            else
              fail "HTTP $status; check the project state, client key, table and SELECT grant."
            fi

            if [[ "$attempt" -eq 3 ]]; then
              fail "$reason All three attempts failed."
            fi
            printf '%s Retrying in 5 seconds (attempt %s/3).\n' "$reason" "$attempt"
            sleep 5
          done
